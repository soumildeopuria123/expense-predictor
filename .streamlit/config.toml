# Streamlit config — everything a bare `streamlit run` needs lives here,
# so no flags are required:
#
#   ./.venv/bin/streamlit run app/dashboard.py
#
# --- server.allowedHosts (intentionally not set) -----------------------------
# A hard-coded allow-list breaks *cloud* deployments: the WebSocket handshake
# is validated against the exact Host header, and both a restored Freebuff
# preview hostname and a Streamlit Cloud subdomain (<sub>.streamlit.app) can
# differ from whatever list is committed here -- the page then loads but
# renders blank ("Rejecting WebSocket connection with disallowed Origin or
# Host header"). The default (empty list) accepts any host, which every
# hosted runtime needs. For local hardening, run ./start.sh <hostname>, which
# writes a live allow-list entry rather than committing one.
[server]
address = "0.0.0.0"
port = 3000
headless = true
