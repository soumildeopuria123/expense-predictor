# Streamlit config — everything a bare `streamlit run` needs lives here,
# so no flags are required:
#
#   ./.venv/bin/streamlit run app/dashboard.py
#
# --- server.allowedHosts ---------------------------------------------------
# Guards the WebSocket handshake against DNS rebinding. Streamlit compares the
# request's Host against each entry *exactly* (ports are ignored), so BOTH the
# local and the preview host must be listed or that host's app stays blank:
#
#   localhost / 127.0.0.1  -> you opening it on this machine
#   <preview host>          -> the Freebuff preview panel (through the proxy)
#
# The preview hostname changes when the environment is restored. If the page
# loads but renders blank, the WebSocket is being rejected: check the log for
#   "Rejecting WebSocket connection with disallowed Origin or Host header"
# to read the host your browser actually sent, then update the list below (or
# re-run ./start.sh <new-host>, which rewrites it for you).
[server]
address = "0.0.0.0"
port = 3000
headless = true
allowedHosts = [
  "localhost",
  "127.0.0.1",
  "pv-ed9329900fe-cefca147-afe1-4c73-a1a9-abd697bff8b3.style.dev",
]
