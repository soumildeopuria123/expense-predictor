[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "expense-ml"
version = "0.1.0"
description = "Smart Expense & Financial Anomalies Predictor (tabular ML)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "polars>=1.0",
  "scikit-learn>=1.4",
  "lightgbm>=4.0",
  "catboost>=1.2",
  "xgboost>=2.0",
  "pyod>=2.0",
  "combo>=0.1.3",
  "streamlit>=1.30",
  "streamlit-aggrid>=1.0",
  "joblib>=1.3",
  "pandas>=2.0",
  "pyarrow>=14",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# optional backend: dense sentence embeddings (pulls torch, ~200MB)
sbert = ["sentence-transformers>=3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
